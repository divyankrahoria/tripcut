[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripcut"
version = "0.2.0"
description = "AI watches your travel footage (Insta360, GoPro, phone) and cuts it into a story."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Divyank Rahoria" }]
keywords = ["video", "editing", "ai", "gemini", "insta360", "gopro", "travel", "ffmpeg", "vlog"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
  "Intended Audience :: End Users/Desktop",
]
dependencies = [
  "google-genai>=1.0",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tripcut = "tripcut.cli:app"

[project.urls]
Homepage = "https://github.com/divyankrahoria/tripcut"
Issues = "https://github.com/divyankrahoria/tripcut/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tripcut"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # Typer-style defaults; the formatter owns line length
